<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <title></title>
    <link rel="stylesheet" href="workspace-navigator.css">
  </head>
  <body>
    <main id="navigator" hidden>
      <header class="toolbar">
        <div class="heading"><h1 id="title"></h1><button id="return" type="button"></button></div>
        <input id="search" type="search" maxlength="4096" autocomplete="off" spellcheck="false" aria-controls="view">
        <p id="notice" role="status" aria-live="polite" hidden></p>
        <p id="operation" role="status" aria-live="polite" hidden></p>
        <div class="view-heading"><h2 id="view-title"></h2><label class="sort-control"><span id="sort-label"></span><select id="sort-mode"><option value="activity"></option><option value="manual"></option></select></label><button id="show-overview" type="button" hidden></button></div>
      </header>
      <div id="view">
        <div id="overview" role="region" tabindex="0" aria-labelledby="view-title"></div>
        <div id="focused" hidden></div>
        <div id="pane-splitter" role="separator" tabindex="0" aria-orientation="horizontal" aria-labelledby="view-title" aria-controls="focused strip" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" hidden></div>
        <div id="strip" role="region" tabindex="0" hidden></div>
        <p id="empty" hidden></p>
      </div>
      <div id="root-drop" role="region" hidden></div>
      <div id="menu-layer" hidden></div>
      <div id="dialog-layer" hidden></div>
    </main>
    <script src="workspace-navigator.js"></script>
  </body>
</html>
